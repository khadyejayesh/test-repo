<!DOCTYPE html>
<html>
<head>
<title>Social Media Data Analysis</title>

<script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fa;
        margin: 0;
        padding: 20px;
        text-align: center;
    }

    h2 {
        margin-bottom: 30px;
    }

    .chart-container {
        width: 90%;
        max-width: 900px;
        margin: 20px auto;
        background: #ffffff;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
</style>

<script type="text/javascript">
google.charts.load('current', {'packages':['corechart']});
google.charts.setOnLoadCallback(drawCharts);

function drawCharts() {

    // -------------------------
    // 1. Line Chart
    // -------------------------
    var data1 = google.visualization.arrayToDataTable([
        ['Date', 'Likes', 'Comments', 'Shares'],
        ['01-Feb', 120, 30, 15],
        ['02-Feb', 150, 40, 25],
        ['03-Feb', 200, 50, 35]
    ]);

    var options1 = {
        title: 'Social Media Engagement Trend',
        curveType: 'function',
        legend: { position: 'bottom' },
        backgroundColor: '#ffffff'
    };

    var chart1 = new google.visualization.LineChart(
        document.getElementById('line_chart')
    );
    chart1.draw(data1, options1);


    // -------------------------
    // 2. Pie Chart
    // -------------------------
    var data2 = google.visualization.arrayToDataTable([
        ['Type', 'Count'],
        ['Likes', 470],
        ['Comments', 120],
        ['Shares', 75]
    ]);

    var options2 = {
        title: 'Total Engagement Distribution',
        backgroundColor: '#ffffff'
    };

    var chart2 = new google.visualization.PieChart(
        document.getElementById('pie_chart')
    );
    chart2.draw(data2, options2);


    // -------------------------
    // 3. Column Chart
    // -------------------------
    var data3 = google.visualization.arrayToDataTable([
        ['Date', 'Followers'],
        ['01-Feb', 5000],
        ['02-Feb', 5050],
        ['03-Feb', 5200]
    ]);

    var options3 = {
        title: 'Followers Growth',
        legend: { position: 'none' },
        backgroundColor: '#ffffff'
    };

    var chart3 = new google.visualization.ColumnChart(
        document.getElementById('column_chart')
    );
    chart3.draw(data3, options3);
}
</script>

</head>

<body>

<h2>Social Media Data Analysis Dashboard</h2>

<div class="chart-container">
    <div id="line_chart" style="width: 100%; height: 400px;"></div>
</div>

<div class="chart-container">
    <div id="pie_chart" style="width: 100%; height: 400px;"></div>
</div>

<div class="chart-container">
    <div id="column_chart" style="width: 100%; height: 400px;"></div>
</div>

</body>
</html>
